name: CI
on:
  push:
    branches: [main, "audit/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run test suite (local mocks only, no network)
        run: node --test
      - name: Verify npm package manifest
        run: node scripts/check-pack.mjs
